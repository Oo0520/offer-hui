name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # CI 构建占位值：仅供 Next.js 构建期实例化 client（不部署、不真实请求）。
    # 生产部署（Vercel）使用真实环境变量重新构建。
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint (non-blocking, historical debt tracked separately)
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build

  worker:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d offer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/offer_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Init schema (auth stub + migrations)
        working-directory: ${{ github.workspace }}
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE TABLE IF NOT EXISTS auth.users (id uuid primary key);"
          psql "$DATABASE_URL" -f infra/supabase/migrations/202609040001_init.sql
      - name: Unit tests
        run: python -m unittest discover tests
