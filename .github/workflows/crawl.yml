name: Daily Crawl

# 北京时间凌晨 2:00 跑 = UTC 18:00
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Incremental crawl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: https://sqmgjxazzpcfjutzscyu.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Chromium for Scrapling
        run: scrapling install chromium || python -m playwright install chromium --with-deps

      - name: Run pipeline (fj99 + campus2027 + open_jobs)
        run: python cli.py crawl

      - name: Run fjrclh incremental (httpx, no browser)
        run: python crawl_fjrclh.py

      - name: Run fjut incremental (Scrapling headless)
        run: python crawl_fjut.py
        continue-on-error: true   # fjut 反爬偶尔抽风，不阻塞整个 workflow
