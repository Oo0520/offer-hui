name: 🐛 Bug 报告
description: 提交一个可复现的 Bug，帮助 Offer派 变得更好
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug！请尽量完整填写以下信息，这能帮助我们更快定位问题。
        注意：**安全漏洞请不要在此公开提交**，请走 [SECURITY.md](../../../blob/main/SECURITY.md) 的安全流程。
  - type: input
    id: url
    attributes:
      label: 出现问题的页面 / 接口
      description: 页面路径（如 `/`、`/calendar`、`/board`）或 API 地址
      placeholder: "例如 /board 或 /api/v1/jobs"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期的行为是什么？
      placeholder: 清晰、简洁地描述 Bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何触发这个 Bug？
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望的正确结果是什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际看到的结果（可附截图）
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 环境信息"
  - type: dropdown
    id: device
    attributes:
      label: 设备类型
      options:
        - 手机
        - 平板
        - 桌面电脑
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      description: 例如 Chrome 120、Safari 17、微信内置浏览器
      placeholder: "Chrome 120"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - iOS
        - Android
        - 其他
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: 是否已登录
      options:
        - 未登录（游客）
        - 已登录
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 本地开发（localhost:3000）
        - 内网穿透公网地址（trycloudflare.com）
        - 其他
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 涉及的数据源（可选）
      description: 如果与岗位数据相关，是哪类来源（如高校就业网、企业官网）
      placeholder: "例如 福建理工大学就业网"
  - type: textarea
    id: logs
    attributes:
      label: 控制台报错 / 日志（可选）
      description: 浏览器控制台错误、Network 面板状态码，或 worker 日志
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 Issue，没有相同问题
          required: true
        - label: 我已提供完整复现步骤和环境信息
          required: true
