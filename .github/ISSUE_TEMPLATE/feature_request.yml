name: ✨ 功能请求
description: 给 Offer派 提一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请描述清楚"为什么需要"和"希望怎么用"，这有助于我们评估。
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 痛点
      description: 你遇到了什么问题？这个功能解决什么场景？
      placeholder: 我在使用 xxx 时，发现 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望的功能表现是什么样？
      placeholder: 希望能在 xxx 页面提供 xxx 能力 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 有没有其他替代做法？
      placeholder: 也可以用 xxx 方式实现，但 ...
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      description: 这个功能主要影响哪个模块？
      options:
        - 岗位浏览 / 筛选
        - 校招日历 / ICS 订阅
        - 求职看板
        - AI 匹配
        - 社区
        - 账号 / 登录
        - Agent 接入（MCP）
        - 数据源 / 爬虫
        - 其他
      multiple: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true
        - label: 我清楚这是公益项目，功能按维护者排期推进
          required: true
